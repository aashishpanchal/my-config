set -g mouse on

# Navigate panes with prefix + h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ==========================================
# Pane Borders
set -g pane-border-style "fg=#3a3f46"
set -g pane-active-border-style "fg=#3a3f46"

# ==========================================
# TMUX STATUS BAR
# ==========================================

set -g status on
set -g status-position top
set -g status-interval 1
set -g status 2
set -g status-format[1] '#[fg=#3b4261,bg=default]#{=-w:─}'
# Main colors
set -g status-style "bg=#141414,fg=#c9d1d9"

# ==========================================
# LEFT
# ==========================================

set -g status-left-length 100

set -g status-left \
"   #[bg=#61afef,fg=#131516,bold] #S #[bg=#131516,fg=#61afef] #[fg=#8b949e]#H "

# ==========================================
# WINDOWS
# ==========================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g window-status-separator ""

set -g window-status-format \
"#[bg=#131516,fg=#555b61]  #I:#W "

set -g window-status-current-format \
"#[bg=#131516,fg=#61afef,bold]  #I:#W "

# ==========================================
# RIGHT
# ==========================================

set -g status-right-length 300

set -g status-right \
"#[fg=#555b61]│ #[fg=#8b949e]#{pane_current_path} #[fg=#555b61]│ #[fg=#c9d1d9]%H:%M #[fg=#555b61]│
 #[fg=#8b949e]%d-%b-%Y "

# ==========================================
# ALIGNMENT
# ==========================================

#set -g status-justify left